<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="http://typo3.org/ns/fluid/ViewHelpers"
      xmlns:wsslider="http://typo3.org/ns/WapplerSystems/WsSlider/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:section name="Default">

    <f:asset.script identifier="tinyslider" src="EXT:ws_slider/Resources/Public/JavaScript/TinySlider/tiny-slider.js" />
    <f:asset.css identifier="tinyslider" href="EXT:ws_slider/Resources/Public/CSS/TinySlider/tiny-slider.css" />

    <div id="{identifier}" class="">

        <f:for each="{items}" as="item" iteration="iterator">
            <f:render partial="Item/Tinyslider" section="{layout}"
                      arguments="{item: item, settings: settings, options: options, iterator:iterator}"/>
        </f:for>

    </div>

    <f:asset.script identifier="{identifier}">{inlineJavascript}</f:asset.script>

</f:section>

</html>
