<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="http://typo3.org/ns/fluid/ViewHelpers"
      xmlns:wsslider="http://typo3.org/ns/WapplerSystems/WsSlider/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:section name="Default">

    <f:asset.script identifier="slick" src="EXT:ws_slider/Resources/Public/JavaScript/Slick/slick.min.js"/>
    <f:asset.css identifier="slick" href="EXT:ws_slider/Resources/Public/CSS/Slick/slick.css"/>
    <f:asset.css identifier="slick-theme" href="EXT:ws_slider/Resources/Public/CSS/Slick/slick-theme.css"/>

    <div id="{identifier}" class=" ">
        <f:for each="{items}" as="item" iteration="iterator">
            <f:render partial="Item/Slick" section="{layout}"
                      arguments="{item: item, settings: settings, options: options, iterator:iterator}"/>
        </f:for>
    </div>

    <f:asset.script identifier="{identifier}">{inlineJavascript}</f:asset.script>

</f:section>

</html>
