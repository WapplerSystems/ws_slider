name: Update Swiper

on:
  schedule:
    # 08:00 UTC daily (GitHub schedules only run from the default branch)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check for new Swiper release
    runs-on: ubuntu-latest
    # Pinned to the Playwright image so the inline visual-test step uses
    # the same browser build as visual-tests.yml — keeps the baselines
    # comparable regardless of whether tests run here or there.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --ipc=host
    # The Playwright image's default shell is dash, which rejects `set -o pipefail`.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Resolve latest Swiper version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nolimits4web/swiper/releases/latest \
            | grep -oP '"tag_name":\s*"\K[^"]+' | sed 's/^v//')
          if [ -z "${VERSION}" ]; then
            echo "Could not resolve latest Swiper version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read currently bundled Swiper version
        id: current
        run: |
          set -euo pipefail
          FILE="Resources/Public/JavaScript/Swiper/swiper-bundle.js"
          VERSION=$(grep -m1 -oP 'Swiper \K[0-9]+\.[0-9]+\.[0-9]+' "${FILE}" || true)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decide whether an update is needed
        id: check
        run: |
          if [ "${{ steps.latest.outputs.version }}" = "${{ steps.current.outputs.version }}" ]; then
            echo "Swiper is already at ${{ steps.current.outputs.version }} — nothing to do."
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download new Swiper assets from jsDelivr
        if: steps.check.outputs.update_needed == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.latest.outputs.version }}"
          BASE="https://cdn.jsdelivr.net/npm/swiper@${V}"
          curl -fsSL "${BASE}/swiper-bundle.js"      -o Resources/Public/JavaScript/Swiper/swiper-bundle.js
          curl -fsSL "${BASE}/swiper-bundle.min.js"  -o Resources/Public/JavaScript/Swiper/swiper-bundle.min.js
          curl -fsSL "${BASE}/swiper-bundle.css"     -o Resources/Public/CSS/Swiper/swiper-bundle.css
          curl -fsSL "${BASE}/swiper-bundle.min.css" -o Resources/Public/CSS/Swiper/swiper-bundle.min.css

      - name: Install Playwright dependencies
        if: steps.check.outputs.update_needed == 'true'
        working-directory: Tests/Visual
        run: npm ci

      - name: Run visual + functional tests against new Swiper
        id: tests
        if: steps.check.outputs.update_needed == 'true'
        continue-on-error: true
        working-directory: Tests/Visual
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && steps.check.outputs.update_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.latest.outputs.version }}
          path: Tests/Visual/playwright-report/
          retention-days: 14

      - name: Compose PR body
        if: steps.check.outputs.update_needed == 'true'
        env:
          OUTCOME: ${{ steps.tests.outcome }}
          FROM: ${{ steps.current.outputs.version }}
          TO: ${{ steps.latest.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${OUTCOME}" = "success" ]; then
            STATUS="**Tests:** PASSED — Playwright visual + functional suite is green against the new bundle."
          else
            STATUS="**Tests:** FAILED — review the [\`playwright-report-${TO}\`](${RUN_URL}) artifact attached to this workflow run before merging. Visual regressions almost always need a baseline refresh; functional regressions usually mean an upstream Swiper API break."
          fi
          {
            echo "Automated update of the bundled Swiper assets."
            echo
            echo "**From:** \`${FROM}\`"
            echo "**To:** \`${TO}\`"
            echo
            echo "Release notes: https://github.com/nolimits4web/swiper/releases/tag/v${TO}"
            echo
            echo "${STATUS}"
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "Updated files (downloaded from \`https://cdn.jsdelivr.net/npm/swiper@${TO}/\`):"
            echo "- \`Resources/Public/JavaScript/Swiper/swiper-bundle.js\`"
            echo "- \`Resources/Public/JavaScript/Swiper/swiper-bundle.min.js\`"
            echo "- \`Resources/Public/CSS/Swiper/swiper-bundle.css\`"
            echo "- \`Resources/Public/CSS/Swiper/swiper-bundle.min.css\`"
          } > pr-body.md

      - name: Create pull request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/swiper-${{ steps.latest.outputs.version }}
          delete-branch: true
          commit-message: "[TASK] Update Swiper to ${{ steps.latest.outputs.version }}"
          title: "Update Swiper to ${{ steps.latest.outputs.version }}"
          body-path: pr-body.md
          add-paths: |
            Resources/Public/JavaScript/Swiper/**
            Resources/Public/CSS/Swiper/**
          labels: |
            dependencies
            swiper